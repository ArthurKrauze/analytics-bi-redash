name: analytics-bi-redash
x-redash-env: &redash-env
  REDASH_DATABASE_URL: postgresql://redash:${POSTGRES_PASSWORD:?Execute scripts/setup.ps1}@postgres/redash
  REDASH_REDIS_URL: redis://redis:6379/0
  REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET:?Execute scripts/setup.ps1}
  REDASH_SECRET_KEY: ${REDASH_SECRET_KEY:?Execute scripts/setup.ps1}
  REDASH_WEB_WORKERS: "2"
  REDASH_LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "1"
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute scripts/setup.ps1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tpch}
      MYSQL_USER: ${MYSQL_USER:-tpch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute scripts/setup.ps1}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup.ps1}
      POSTGRES_DB: redash
    volumes:
      - redash_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash -d redash"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  server:
    image: redash/redash:10.1.0.b50633
    command: server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment: *redash-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    restart: unless-stopped
    environment:
      <<: *redash-env
      QUEUES: queries,scheduled_queries,schemas,default
      WORKERS_COUNT: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  scheduler:
    image: redash/redash:10.1.0.b50633
    command: scheduler
    restart: unless-stopped
    environment: *redash-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  mysql_data:
  mongodb_data:
  redash_postgres:
